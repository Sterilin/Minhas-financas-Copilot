<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2028"/>
      <stop offset="100%" stop-color="#0D0F12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE92"/>
      <stop offset="100%" stop-color="#B08968"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#2D3442" stroke-width="10"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(212, 163, 115, 0.12)" stroke-width="2"/>

  <!-- Wallet Body -->
  <rect x="116" y="166" width="280" height="196" rx="32" fill="url(#accentGrad)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>

  <!-- Wallet Top Flap / Pocket -->
  <path d="M116 210 Q 256 240 396 210" stroke="#8C6546" stroke-width="5" fill="none"/>

  <!-- Card peak out -->
  <rect x="156" y="136" width="200" height="60" rx="14" fill="#202530" stroke="#3D4659" stroke-width="4"/>
  <rect x="180" y="156" width="60" height="8" rx="4" fill="url(#glowGrad)"/>

  <!-- Wallet Clasp -->
  <rect x="316" y="234" width="86" height="60" rx="20" fill="#202530" stroke="#D4A373" stroke-width="6"/>
  <circle cx="356" cy="264" r="10" fill="url(#glowGrad)"/>

  <!-- Growth trendline indicator -->
  <path d="M156 320 L 210 286 L 256 304 L 330 248" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="314,248 330,248 330,264" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

